[package]
name = "bnova"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Bnova - Boost by nova, RAM cleaner and PC optimizer"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "bnova"
path = "main.rs"
